<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XML API Demo</title>
    <style>
        body { font-family: sans-serif; display: flex; height: 100vh; margin: 0; }
        #source-pane { width: 40%; padding: 10px; display: flex; flex-direction: column; border-right: 1px solid #ccc; }
        #visual-pane { width: 40%; padding: 10px; overflow-y: auto; }
        #prop-pane { width: 20%; padding: 10px; background: #f0f0f0; border-left: 1px solid #ccc; }
        textarea { flex: 1; font-family: monospace; resize: none; }
        .node { margin-left: 20px; padding: 2px; cursor: pointer; border: 1px solid transparent; }
        .node:hover { background: #eee; }
        .node.selected { background: #d0e0ff; border: 1px solid #a0c0ff; }
        .tag-name { color: purple; font-weight: bold; }
        .attr-name { color: brown; }
        .attr-value { color: blue; }
        .text-node { color: #333; }
        .error { color: red; }
    </style>
</head>
<body>
    <div id="source-pane">
        <h3>XML Source</h3>
        <textarea id="source-editor" spellcheck="false"></textarea>
        <div id="status" class="error"></div>
    </div>
    <div id="visual-pane">
        <h3>Visual DOM (Read/Write)</h3>
        <div id="tree-root"></div>
    </div>
    <div id="prop-pane">
        <h3>Properties</h3>
        <div id="prop-editor">Select a node...</div>
    </div>
    <script src="bundle.js"></script>
</body>
</html>
